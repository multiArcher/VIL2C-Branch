# --- MAPPO specific parameters ---

action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"

buffer_size: 10
batch_size_run: 10
batch_size: 10
# On-policy: one PPO update per collected batch (EPyMARL default).
# The repo default (null → batch_size_run) is for off-policy QMIX-style reuse.
sample_times_per_run: 1

# update the target network every {} training steps
target_update_interval_or_tau: 0.01

lr: 0.0003
hidden_dim: 128

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False

agent_output_type: "pi_logits"
learner: "ppo_learner"
entropy_coef: 0.01
use_rnn: True
standardise_returns: True
standardise_rewards: True
use_gae: True
gae_lambda: 0.95
q_nstep: 5 # Used only when use_gae is False (1 corresponds to r + gammaV)
critic_type: "cv_critic"
epochs: 10
eps_clip: 0.05
name: "mappo"

t_max: 2005000
