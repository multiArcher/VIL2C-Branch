# Observation-delay adaptation, not the original action-delay experiment.
name: dama_ddpg
runner: dama_parallel
mac: dama_mac
agent: dama_agent
learner: dama_learner
critic_type: dama_critic
agent_output_type: pi_logits
use_rnn: True
obs_agent_id: True
obs_last_action: False
obs_individual_obs: False
dama_history_length: 16
dama_use_history: True
dama_use_alignment: True
dama_require_no_delay_train: True
dama_gumbel_temperature: 1.0
dama_checkpoint_agents: null
hidden_dim: 128
lr: 0.0005
critic_lr: 0.0005
gamma: 0.99
reg: 0.001
grad_norm_clip: 10
target_update_interval_or_tau: 0.01
standardise_rewards: False
standardise_returns: False
batch_size_run: 16
batch_size: 32
buffer_size: 400_000
buffer_cpu_only: True
sample_times_per_run: 4
test_greedy: True
test_nepisode: 32
t_max: 10_000_000
